<!doctype html>
<!-- Shown by the shell when caresy.co.in cannot be reached (offline / bad network). -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caresy — offline</title>
  <style>
    body { margin: 0; display: grid; place-items: center; min-height: 100vh; background: #f8faf5; font-family: -apple-system, system-ui, sans-serif; color: #16302b; }
    main { text-align: center; padding: 0 32px; }
    h1 { font-size: 1.3rem; margin: 0 0 8px; }
    p { color: #5b6b64; font-size: 0.95rem; margin: 0 0 20px; }
    button { padding: 12px 28px; border: none; border-radius: 999px; background: #0d7a66; color: #fff; font-size: 1rem; font-weight: 700; }
    small { display: block; margin-top: 24px; color: #5b6b64; }
  </style>
</head>
<body>
  <main>
    <h1>You&rsquo;re offline</h1>
    <p>Caresy needs an internet connection to book and track visits. Check your network and try again.</p>
    <button onclick="location.replace('https://caresy.co.in')">Retry</button>
    <small>Urgent? Call us: <a href="tel:+919717500225">+91 97175 00225</a></small>
  </main>
</body>
</html>
